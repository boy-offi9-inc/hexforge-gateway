name: Release

# Hybrid: releases automatically when package.json's version is bumped to one
# with no tag yet, and can also be run by hand from the Actions tab
# (Run workflow) - to retry after a failed run, or with dry_run to preview
# the notes. Either way it only ever releases an untagged version from main.
on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the release notes without tagging or publishing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "package.json version '$VERSION' is not valid semver" >&2
            exit 1
          fi

          # A version bump that forgot the lockfile used to fail the release
          # ("bump both") - now the lockfile is synced automatically and the
          # release proceeds on the bumped version. The sync commit is pushed
          # with GITHUB_TOKEN, which does not retrigger workflows, so this run
          # is the only one that acts.
          if [ "$VERSION" != "$LOCK_VERSION" ]; then
            echo "package.json ($VERSION) and package-lock.json ($LOCK_VERSION) disagree - syncing the lockfile"
            npm install --package-lock-only
            git config user.name "Boy Offi9"
            git config user.email "boyxoffi9@gmail.com"
            git add package-lock.json
            git commit -m "chore: sync package-lock.json to v$VERSION"
            git push origin HEAD:main
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            is_new=false
            echo "v$VERSION already released - nothing to do."
          else
            is_new=true
            echo "v$VERSION is new - releasing."
          fi
          echo "is_new=$is_new" >> "$GITHUB_OUTPUT"

  ci:
    needs: detect
    if: needs.detect.outputs.is_new == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [detect, ci]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREV:+$PREV..HEAD}

          {
            echo "## What's changed"
            echo
            git log $RANGE --no-merges --pretty='- %s (%h)' \
              | grep -viE '^- (chore: )?bump version' || true
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
            fi
          } > notes.md

          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Dry run: v$VERSION (nothing tagged or published)"
              echo
              cat notes.md
            } >> "$GITHUB_STEP_SUMMARY"
            cat notes.md
            exit 0
          fi

          case "$VERSION" in
            *-*) KIND="--prerelease" ;;
            *)   KIND="--latest" ;;
          esac

          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            $KIND

  docker:
    # Publishes both images to GHCR so `docker compose up -d` (the compose
    # file pulls ghcr.io/...:latest-runtime) is a one-command install with
    # no clone or build: the tool-free MCP-introspection image and the
    # full pinned runtime image. amd64 only - the pinned toolchain's
    # downloads (Ghidra, jadx) are x86 binaries and multi-arch would
    # double a already-heavy build. Skipped on dry runs.
    needs: [detect, ci]
    if: github.ref == 'refs/heads/main' && needs.detect.outputs.is_new == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the MCP-introspection image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ needs.detect.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push the pinned runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ needs.detect.outputs.version }}-runtime
            ghcr.io/${{ github.repository }}:latest-runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan - MCP-introspection image
        # Blocks the release on critical/highs in the published image itself:
        # the artifact we tell people to `docker pull` is the one that gets
        # scanned, every release, not a one-off audit.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:v${{ needs.detect.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan - runtime image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:v${{ needs.detect.outputs.version }}-runtime
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # The runtime image pins a real toolchain (Ghidra, jadx, JDK, their
          # OS deps) - a finding there is usually an unfixed OS package, which
          # would block releases indefinitely. Report for now: flip this to 1
          # once the baseline is clean.
          exit-code: "0"
          output: trivy-runtime.txt

      - name: Show runtime-image findings
        if: always()
        run: grep -E 'TOTAL|CRITICAL|HIGH' trivy-runtime.txt | tail -5 || true
